---
# yaml-language-server: $schema=https://blue-build.org
name: aluc4rd-bazzite
description: Stabiles Bazzite mit automatischer MT7927 Treiber-Integration (Jetm Upstream)

# Das offizielle, stabile Fundament von ublue-os
base-image: ghcr.io/ublue-os/bazzite-gnome-nvidia
image-version: latest

modules:
  # Zuerst installieren wir die Werkzeuge, damit sie für spätere Schritte bereitstehen
  - type: rpm-ostree
    install:
      - dkms
      - kernel-devel
      - kernel-headers

  - type: containerfile
    snippets:
      # 1. Firmware an alle Orte verteilen (wie Samutoljamo)
      - COPY firmware/* /usr/lib/firmware/mediatek/
      - RUN mkdir -p /usr/lib/firmware/mediatek/mt7927/
      - RUN cp /usr/lib/firmware/mediatek/*.bin /usr/lib/firmware/mediatek/mt7927/
      - RUN ln -sf /usr/lib/firmware/mediatek/WIFI_RAM_CODE_MT6639_2_1.bin /usr/lib/firmware/mediatek/WIFI_RAM_CODE_MT7927_1_1.bin
      - RUN ln -sf /usr/lib/firmware/mediatek/WIFI_MT6639_PATCH_MCU_2_1_hdr.bin /usr/lib/firmware/mediatek/WIFI_MT7927_patch_mcu_1_1_hdr.bin

      # 2. Die UDEV-Regel FIXEN (kein Verschachteln von Anführungszeichen mehr)
      - |
        RUN printf 'ACTION=="add", SUBSYSTEM=="pci", ATTR{vendor}=="0x14c3", ATTR{device}=="0x7927", RUN+="/usr/sbin/modprobe mt7925e", RUN+="/usr/bin/sh -c \"echo 14c3 7927 > /sys/bus/pci/drivers/mt7925e/new_id\""\n' > /usr/lib/udev/rules.d/99-mt7927.rules
