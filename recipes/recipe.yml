---
# yaml-language-server: $schema=https://blue-build.org
name: mein-bazzite-ace
description: Echtes Bazzite mit nativem MediaTek Wi-Fi 7 Support
base-image: ghcr.io/ublue-os/bazzite-gnome-nvidia
image-version: 41 # Wir gehen auf die stabile Version 41 für volle Kompatibilität

modules:
  - type: files
    files:
      - source: system
        destination: /

  # Hier binden wir die Firmware ein, die du bereits hast
  - type: containerfile
    snippets:
      - COPY firmware/WIFI_RAM_CODE_MT6639_2_1.bin /usr/lib/firmware/mediatek/mt7927/WIFI_RAM_CODE_MT7927_1_1.bin
      - COPY firmware/WIFI_MT6639_PATCH_MCU_2_1_hdr.bin /usr/lib/firmware/mediatek/mt7927/WIFI_MT7927_patch_mcu_1_1_hdr.bin
      - COPY firmware/BT_RAM_CODE_MT6639_2_1_hdr.bin /usr/lib/firmware/mediatek/mt7927/BT_RAM_CODE_MT6639_2_1_hdr.bin

  # Wir nutzen das offizielle RPM-OSTREE Modul für den Treiber von jetm, 
  # aber im Bazzite-Kontext
  - type: rpm-ostree
    repos:
      - https://fedorainfracloud.org
    install:
      - mediatek-mt7927-dkms

  - type: firstboot
    notify: true
    setup-commands:
      - /usr/bin/bazzite-setup
