---
# yaml-language-server: $schema=https://blue-build.org
name: aluc4rd-bazzite
description: Stabiles Bazzite mit automatischer MT7927 Treiber-Integration (Jetm Upstream)

# Das offizielle, stabile Fundament von ublue-os
base-image: ghcr.io/ublue-os/bazzite-gnome-nvidia
image-version: latest

modules:
  # Zuerst installieren wir die Werkzeuge, damit sie für spätere Schritte bereitstehen
  - type: rpm-ostree
    install:
      - dkms
      - kernel-devel
      - kernel-headers

  - type: containerfile
    snippets:
      # 1. Wir löschen die (vielleicht inkompatible) Standard-Firmware von Fedora
      - RUN rm -rf /usr/lib/firmware/mediatek/WIFI_RAM_CODE_MT7927_1_1.bin
      - RUN rm -rf /usr/lib/firmware/mediatek/WIFI_MT7927_patch_mcu_1_1_hdr.bin
      
      # 2. Wir setzen deine stabilen Dateien als "echte" Systemdateien ein
      - COPY firmware/WIFI_RAM_CODE_MT6639_2_1.bin /usr/lib/firmware/mediatek/WIFI_RAM_CODE_MT7927_1_1.bin
      - COPY firmware/WIFI_MT6639_PATCH_MCU_2_1_hdr.bin /usr/lib/firmware/mediatek/WIFI_MT7927_patch_mcu_1_1_hdr.bin
      - COPY firmware/BT_RAM_CODE_MT6639_2_1_hdr.bin /usr/lib/firmware/mediatek/BT_RAM_CODE_MT7927_1_1_hdr.bin

      # 3. Wir erzwingen das Laden des Treibers über die UDEV-Regeln (sehr mächtig!)
      - RUN printf 'ACTION=="add", SUBSYSTEM=="pci", ATTR{vendor}=="0x14c3", ATTR{device}=="0x7927", RUN+="/usr/sbin/modprobe mt7925e", RUN+="/usr/bin/bash -c \"echo 14c3 7927 > /sys/bus/pci/drivers/mt7925e/new_id\""' > /usr/lib/udev/rules.d/99-mt7927.rules
