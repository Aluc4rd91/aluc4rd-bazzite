---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: mein-bazzite-ace
description: Echtes Bazzite mit nativem MediaTek Wi-Fi 7 Support
base-image: ghcr.io/ublue-os/bazzite-gnome-nvidia
image-version: 43

modules:
  - type: files
    files:
      - source: system
        destination: /

  # Integration des Treibers über das offizielle Repo
  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/ublue-os/bazzite/repo/fedora-43/ublue-os-bazzite-fedora-43.repo

  - type: containerfile
    snippets:
      # Wir holen uns die Firmware-Dateien und die Logik direkt von samutoljamo
      - COPY firmware/* /usr/lib/firmware/mediatek/mt7927/
      # Wir setzen die Symlinks genau so, wie samutoljamo es in seinem Projekt vorsieht
      - RUN ln -s /usr/lib/firmware/mediatek/mt7927/WIFI_RAM_CODE_MT6639_2_1.bin /usr/lib/firmware/mediatek/mt7927/WIFI_RAM_CODE_MT7927_1_1.bin
      - RUN ln -s /usr/lib/firmware/mediatek/mt7927/WIFI_MT6639_PATCH_MCU_2_1_hdr.bin /usr/lib/firmware/mediatek/mt7927/WIFI_MT7927_patch_mcu_1_1_hdr.bin    
    install:
      - mediatek-mt7927-dkms
