---
# yaml-language-server: $schema=https://blue-build.org
name: aluc4rd-bazzite
description: Stabiles Bazzite mit automatischer MT7927 Treiber-Integration (Jetm Upstream)

# Das offizielle, stabile Fundament von ublue-os
base-image: ghcr.io/ublue-os/bazzite-gnome-nvidia
image-version: latest

modules:
  # Zuerst installieren wir die Werkzeuge, damit sie für spätere Schritte bereitstehen
  - type: rpm-ostree
    install:
      - dkms
      - kernel-devel
      - kernel-headers

  - type: containerfile
    snippets:
      # 1. Firmware an alle Orte (wie gehabt)
      - COPY firmware/* /usr/lib/firmware/mediatek/
      - RUN mkdir -p /usr/lib/firmware/mediatek/mt7927/ && cp /usr/lib/firmware/mediatek/*.bin /usr/lib/firmware/mediatek/mt7927/

      # 2. Den Treiber von JETM direkt klonen und registrieren
      - RUN git clone https://github.com /tmp/mt7927
      - RUN cp -r /tmp/mt7927 /usr/src/mediatek-mt7927-2.11
      - RUN dkms add -m mediatek-mt7927 -v 2.11
